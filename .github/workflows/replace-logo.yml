name: Replace logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace embedded logo
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'(<a[^>]*class="brand"[^>]*>.*?<img\s+src=")[^"]*(")',
              r'\1icon.png\2',
              s,
              count=1,
              flags=re.S
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Save change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace embedded logo [skip ci]" || exit 0
          git push
